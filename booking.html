<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শুরু করুন | মাইক্রোক্যাম্পাস বিডি</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.407.0/dist/umd/lucide.min.js" defer></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700;800&family=Tiro+Bangla:ital@0;1&family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                fontFamily: {
                    sans: ['Tiro Bangla', 'Inter', 'sans-serif'],
                    display: ['Anek Bangla', 'Outfit', 'sans-serif'],
                }
            }
        }
    </script>
</head>

<body class="font-sans antialiased text-slate-800 bg-slate-50 min-h-screen flex flex-col">

    <!-- Simple Nav -->
    <nav class="py-6 px-6 max-w-4xl mx-auto w-full flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-2 font-display font-bold text-xl text-slate-900">
            <img src="assets/logo.png" alt="MicroCampus Logo" class="w-8 h-8 object-contain">
            MicroCampus
        </a>
        <a href="index.html" class="text-sm font-medium text-slate-500 hover:text-sky-600 transition-colors">
            হোম পেজে ফিরে যান
        </a>
    </nav>

    <main class="flex-1 flex items-center justify-center p-6">
        <div class="max-w-xl w-full">
            <div class="text-center mb-10">
                <h1 class="font-display text-4xl font-bold text-slate-900 mb-3">শুরু করুন</h1>
                <p class="text-slate-500">নিচের তথ্যগুলো পূরণ করুন, আমাদের প্রতিনিধি আপনার সাথে দ্রুত যোগাযোগ করবেন।</p>
            </div>

            <div class="bg-white rounded-3xl p-8 md:p-10 shadow-xl shadow-slate-200/50 border border-slate-100">
                <form action="process.php" method="POST" class="space-y-5">
                    <div class="space-y-1.5">
                        <label class="text-sm font-bold text-slate-700 ml-1">আপনার পূর্ণ নাম</label>
                        <input type="text" name="name" required placeholder="আপনার নাম লিখুন"
                            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all">
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-sm font-bold text-slate-700 ml-1">ইমেইল এড্রেস</label>
                        <input type="email" name="email" required placeholder="example@email.com"
                            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all">
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-sm font-bold text-slate-700 ml-1">প্রতিষ্ঠানের নাম (স্কুল/মাদ্রাসা)</label>
                        <input type="text" name="institution" required placeholder="আপনার স্কুলের নাম"
                            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <label class="text-sm font-bold text-slate-700 ml-1">মোবাইল নম্বর</label>
                            <input type="tel" name="phone" required placeholder="01XXX..."
                                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-sm font-bold text-slate-700 ml-1">কিসে আগ্রহী?</label>
                            <select name="type" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all appearance-none cursor-pointer">
                                <option value="Demo">ফ্রি ডেমো</option>
                                <option value="Trial">ফ্রি ট্রায়াল</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit"
                        class="w-full py-4 bg-slate-900 text-white rounded-xl font-bold hover:bg-sky-600 transition-all mt-4 shadow-lg shadow-sky-100">
                        রিকোয়েস্ট জমা দিন
                    </button>
                </form>
            </div>
            
            <p class="text-center mt-8 text-[10px] text-slate-400">
                &copy; ২০২৬ <a href="https://vivagotechnologies.com" target="_blank" class="hover:text-slate-600 transition-colors">Vivago Technologies</a>. MicroCampus is a SaaS product of Vivago Technologies.
            </p>
        </div>
    </main>

    <script>
        window.onload = () => { lucide.createIcons(); }
    </script>
</body>

</html>
